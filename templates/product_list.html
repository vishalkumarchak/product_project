<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
        }

        .container{
            width:90%;
            margin:auto;
        }

        .card{
            width:300px;
            background:white;
            padding:15px;
            margin:15px;
            display:inline-block;
            border-radius:10px;
            box-shadow:0 0 10px #ccc;
        }

        img{
            width:100%;
            height:200px;
            object-fit:cover;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Product List</h1>

    {% for product in products %}

    <div class="card">

        <img src="{{ product.image.url }}" alt="">

        <h2>{{ product.name }}</h2>

        <h3>₹ {{ product.price }}</h3>

        <p>{{ product.description }}</p>

    </div>

    {% endfor %}

</div>

</body>
</html>
